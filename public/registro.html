<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hñähñu — Entrar o crear cuenta</title>
    <style>
        /* Mismo diseño que index.html y las lecciones: blanco, verde #58cc02, azul #1cb0f6, Nunito */
        @import url("https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap");

        :root {
            --tinta: #e8eef2;
            --tinta-suave: #17394a;
            --lago: #1cb0f6;
            --lago-oscuro: #1899d6;
            --verde: #58cc02;
            --verde-oscuro: #58a700;
            --cempasuchil: #58cc02;
            --fondo: #1e2d36;
            --superficie: #16222a;
            --texto: #e8eef2;
            --texto-suave: #a3afb6;
            --linea: #36464f;
            --error: #ff4b4b;
            --radio: 16px;
            --ancho-menu: 240px;
            --sombra: none;
            --sombra-alta: none;
        }

        *, *::before, *::after { box-sizing: border-box; }
        :root { color-scheme: dark; }

        body {
            background: #16222a;
            margin: 0;
            font-family: "Nunito", "Segoe UI", system-ui, sans-serif;
            font-size: 1.05rem;
            line-height: 1.65;
            color: var(--texto);
            background: var(--fondo);
        }

        /* ---------- Panel lateral (igual al menú del index) ---------- */
        .sidebar1 {
            position: fixed;
            inset: 0 auto 0 0;
            width: var(--ancho-menu);
            display: flex;
            flex-direction: column;
            padding: 28px 18px;
            background: #16222a;
            color: var(--texto);
            border-right: 2px solid var(--linea);
            z-index: 20;
        }

        .logo {
            text-align: center;
            padding-bottom: 22px;
            margin-bottom: 22px;
            border-bottom: 2px solid var(--linea);
        }

        .logo img { max-width: 120px; height: auto; border-radius: 100px; }

        .sidebar1 ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; flex: 1; }

        .sidebar1 li {
            padding: 11px 16px;
            border-radius: 10px;
            color: var(--texto-suave);
            font-weight: 800;
        }

        .sidebar1 li:last-child {
            margin-top: auto;
            border: 2px solid var(--linea);
            border-bottom-width: 4px;
            text-align: center;
            font-size: .9rem;
        }

        /* ---------- Contenido ---------- */
        .main-content {
            margin-left: var(--ancho-menu);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 20px;
        }

        .marco {
            width: 100%;
            max-width: 460px;
            background: var(--superficie);
            border-radius: var(--radio);
            border: 2px solid var(--linea);
            border-bottom-width: 4px;
            padding: 40px 34px 32px;
            position: relative;
            overflow: hidden;
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            line-height: 1.2;
            margin: 6px 0 4px;
            color: var(--tinta);
        }

        .subtitulo { color: var(--texto-suave); margin: 0 0 24px; }
        .subtitulo strong { color: #89e219; }

        /* Pestañas */
        .pestanas {
            display: flex;
            gap: 4px;
            padding: 4px;
            margin-bottom: 24px;
            background: var(--fondo);
            border: 2px solid var(--linea);
            border-radius: 14px;
        }

        .pestana {
            flex: 1;
            border: none;
            background: none;
            padding: 10px 0;
            border-radius: 10px;
            font: inherit;
            font-weight: 800;
            font-size: .95rem;
            color: var(--texto-suave);
            cursor: pointer;
            transition: background .2s, color .2s;
        }

        .pestana:hover { color: var(--tinta); }
        .pestana.activa { background: #17394a; color: var(--lago); box-shadow: inset 0 0 0 2px var(--lago); }

        form { display: none; flex-direction: column; gap: 16px; }
        form.activo { display: flex; }

        label {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: .8rem;
            font-weight: 800;
            letter-spacing: .04em;
            text-transform: uppercase;
            color: var(--texto-suave);
        }

        input, select {
            font: inherit;
            font-size: 1rem;
            font-weight: 600;
            text-transform: none;
            letter-spacing: 0;
            padding: 12px 14px;
            border: 2px solid var(--linea);
            border-radius: 12px;
            background: #16222a;
            color: var(--texto);
            transition: border-color .2s, box-shadow .2s;
            width: 100%;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--lago);
            box-shadow: 0 0 0 4px rgba(28, 176, 246, .18);
        }

        .campo-clave { position: relative; }
        .campo-clave input { padding-right: 78px; }
        .ver {
            position: absolute;
            right: 8px; bottom: 7px;
            border: none; background: none;
            font: inherit; font-size: .82rem; font-weight: 800;
            color: var(--lago); cursor: pointer; padding: 6px 8px;
        }

        .dos { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

        button.enviar {
            margin-top: 6px;
            background: var(--verde);
            color: #fff;
            border: none;
            border-bottom: 4px solid var(--verde-oscuro);
            border-radius: 16px;
            padding: 13px;
            font: inherit;
            font-weight: 800;
            font-size: 1.02rem;
            letter-spacing: .5px;
            text-transform: uppercase;
            cursor: pointer;
        }

        button.enviar:active { transform: translateY(2px); border-bottom-width: 2px; }
        button.enviar:disabled { background: #36464f; border-bottom-color: #aaa; color: #7d8a91; cursor: not-allowed; transform: none; }

        .mensaje { margin-top: 18px; padding: 12px 14px; border-radius: 10px; font-size: .95rem; font-weight: 600; display: none; }
        .mensaje.mostrar { display: block; }
        .mensaje.exito { background: #1e3b14; color: #89e219; border: 2px solid #58cc02; }
        .mensaje.error { background: #40201f; color: #ff4b4b; border: 2px solid #ff4b4b; }

        .pie { margin: 22px 0 0; text-align: center; font-size: .9rem; color: var(--texto-suave); }
        .pie a { color: var(--lago); font-weight: 800; text-decoration: none; }
        .pie a:hover { text-decoration: underline; }

        /* ---------- Pantallas pequeñas: el menú pasa arriba ---------- */
        @media (max-width: 820px) {
            .sidebar1 { position: static; width: auto; flex-direction: row; align-items: center; padding: 12px 18px; gap: 14px; }
            .logo { padding: 0; margin: 0; border: 0; }
            .logo img { max-width: 52px; }
            .sidebar1 ul { display: none; }
            .sidebar1::after { content: 'Hñähñu · Aprende otomí'; font-weight: 800; }
            .main-content { margin-left: 0; min-height: auto; align-items: flex-start; padding: 22px 14px; }
            .marco { padding: 34px 20px 26px; }
            .dos { grid-template-columns: 1fr; }
        }
        @media (max-width: 420px) { .marco { padding: 28px 16px 22px } h1 { font-size: 1.7rem } .main-content { padding: 14px 10px } }
    </style>
</head>

    <script>
        const pestanas = document.querySelectorAll('.pestana');
        const formularios = document.querySelectorAll('form');
        const mensaje = document.getElementById('mensaje');

        function mostrarFormulario(id) {
            pestanas.forEach(b => b.classList.toggle('activa', b.dataset.form === id));
            formularios.forEach(f => f.classList.toggle('activo', f.id === id));
            ocultarMensaje();
        }
        pestanas.forEach(btn => btn.addEventListener('click', () => mostrarFormulario(btn.dataset.form)));
        document.querySelectorAll('[data-ir]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); mostrarFormulario(a.dataset.ir); }));

        // Botones "Mostrar / Ocultar" contraseña
        document.querySelectorAll('.ver').forEach(b => b.addEventListener('click', () => {
            const input = b.previousElementSibling;
            const oculto = input.type === 'password';
            input.type = oculto ? 'text' : 'password';
            b.textContent = oculto ? 'Ocultar' : 'Mostrar';
        }));

        function mostrarMensaje(texto, tipo) { mensaje.textContent = texto; mensaje.className = 'mensaje mostrar ' + tipo; }
        function ocultarMensaje() { mensaje.className = 'mensaje'; }

        async function enviarFormulario(url, datos) {
            const respuesta = await fetch(url, {
                method: 'POST',
                credentials: 'same-origin',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos)
            });
            const texto = await respuesta.text();
            let cuerpo;
            try { cuerpo = JSON.parse(texto); }
            catch (e) {
                console.error('Respuesta del servidor:', texto);
                throw new Error('El servidor no respondió como se esperaba. ¿Abriste la página desde http://localhost/ (XAMPP) y no como archivo?');
            }
            return { ok: respuesta.ok, cuerpo };
        }

        // Fecha de nacimiento: solo se aceptan personas de 10 años o más (y no mayores de 120)
        const EDAD_MINIMA = 10, EDAD_MAXIMA = 120;
        const campoFecha = document.getElementById('fecha_nac');
        function fechaIso(d) {
            return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        }
        (function () {
            const hoy = new Date();
            campoFecha.max = fechaIso(new Date(hoy.getFullYear() - EDAD_MINIMA, hoy.getMonth(), hoy.getDate()));
            campoFecha.min = fechaIso(new Date(hoy.getFullYear() - EDAD_MAXIMA, hoy.getMonth(), hoy.getDate()));
        })();
        campoFecha.addEventListener('input', () => {
            const v = campoFecha.value;
            if (!v) { campoFecha.setCustomValidity(''); return; }
            if (v > campoFecha.max) campoFecha.setCustomValidity('Debes tener al menos ' + EDAD_MINIMA + ' años para registrarte.');
            else if (v < campoFecha.min) campoFecha.setCustomValidity('Escribe una fecha de nacimiento válida.');
            else campoFecha.setCustomValidity('');
        });

        async function manejar(e, url, textoExito) {
            e.preventDefault();
            const boton = e.target.querySelector('button.enviar');
            boton.disabled = true;
            const datos = Object.fromEntries(new FormData(e.target));
            try {
                const { ok, cuerpo } = await enviarFormulario(url, datos);
                if (ok && cuerpo.exito) {
                    mostrarMensaje(textoExito(cuerpo), 'exito');
                    setTimeout(() => { window.location.href = 'index.html'; }, 900);
                    return;
                }
                mostrarMensaje(cuerpo.mensaje || 'Ocurrió un error', 'error');
            } catch (err) {
                console.error(err);
                mostrarMensaje(err.message, 'error');
            }
            boton.disabled = false;
        }

        document.getElementById('form-login').addEventListener('submit', e => manejar(e, '../api/login.php', c => c.mensaje || 'Inicio de sesión exitoso'));
        document.getElementById('form-registro').addEventListener('submit', e => manejar(e, '../api/registro.php', c => '¡Cuenta creada! Bienvenido, ' + c.usuario.nombre));
    </script>
</body>

</html>
